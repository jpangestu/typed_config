repository: https://github.com/jpangestu/typed_config/tree/main/packages/typed_config_riverpod
issue_tracker: https://github.com/jpangestu/typed_config/issues

environment:
  sdk: ^3.13.4

dependencies:
  riverpod: ^3.4.3
  typed_config: ^0.1.0

dependency_overrides:
  typed_config:
    path: ../typed_config

dev_dependencies:
  lints: ^6.0.0
  test: ^1.32.0
